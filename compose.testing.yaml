# Standalone, disposable stack. Only the gateway is published, on a random port.
services:
  resource-db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: resources, POSTGRES_USER: resources, POSTGRES_PASSWORD: resources }
    volumes: [ "./init-scripts/resource-db:/docker-entrypoint-initdb.d:ro" ]
    tmpfs: [ /var/lib/postgresql/data ]
    healthcheck:
      test: [ CMD-SHELL, "pg_isready -U resources -d resources" ]
      interval: 2s
      timeout: 3s
      retries: 30
  song-db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: songs, POSTGRES_USER: songs, POSTGRES_PASSWORD: songs }
    volumes: [ "./init-scripts/song-db:/docker-entrypoint-initdb.d:ro" ]
    tmpfs: [ /var/lib/postgresql/data ]
    healthcheck:
      test: [ CMD-SHELL, "pg_isready -U songs -d songs" ]
      interval: 2s
      timeout: 3s
      retries: 30
  rabbitmq:
    image: rabbitmq:4.1-management
    environment: { RABBITMQ_DEFAULT_USER: resources, RABBITMQ_DEFAULT_PASS: resources }
    healthcheck:
      test: [ CMD, rabbitmq-diagnostics, -q, ping ]
      interval: 3s
      timeout: 5s
      retries: 30
  localstack:
    build: ./init-scripts/localstack
    environment:
      SERVICES: s3
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
      RESOURCE_STORAGE_BUCKET: resources
      AWS_DEFAULT_REGION: us-east-1
    healthcheck:
      test: [ CMD-SHELL, "awslocal s3api head-bucket --bucket resources >/dev/null 2>&1" ]
      interval: 3s
      timeout: 5s
      retries: 40
  eureka-server:
    build: ./eureka-server
    environment:
      EUREKA_SERVER_HOSTNAME: eureka-server
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
    healthcheck:
      test: [ CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8761/" ]
      interval: 3s
      timeout: 5s
      retries: 40
  resource-service:
    build: ./resource-service
    environment:
      RESOURCE_DB_URL: jdbc:postgresql://resource-db:5432/resources
      RESOURCE_DB_USER: resources
      RESOURCE_DB_PASSWORD: resources
      RESOURCE_STORAGE_ENDPOINT: http://localstack:4566
      RESOURCE_STORAGE_BUCKET: resources
      SONG_SERVICE_URL: http://song-service
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      EUREKA_PREFER_IP_ADDRESS: "true"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: resources
      RABBITMQ_PASSWORD: resources
    depends_on:
      resource-db: { condition: service_healthy }
      localstack: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
  song-service:
    build: ./song-service
    environment:
      SONG_DB_URL: jdbc:postgresql://song-db:5432/songs
      SONG_DB_USER: songs
      SONG_DB_PASSWORD: songs
      SONG_SERVICE_PORT: "8081"
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      EUREKA_PREFER_IP_ADDRESS: "true"
    depends_on:
      song-db: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
  resource-processor:
    build: ./resource-processor
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: resources
      RABBITMQ_PASSWORD: resources
      RESOURCE_SERVICE_URL: http://resource-service
      SONG_SERVICE_URL: http://song-service
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
    depends_on:
      rabbitmq: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
  api-gateway:
    build: ./api-gateway
    ports: [ "127.0.0.1::8082" ]
    environment:
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      EUREKA_PREFER_IP_ADDRESS: "true"
    depends_on:
      eureka-server: { condition: service_healthy }
      resource-service: { condition: service_started }
      song-service: { condition: service_started }
