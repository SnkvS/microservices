server.port=${STORAGE_SERVICE_PORT:8084}
spring.application.name=storage-service
spring.datasource.url=${STORAGE_DB_URL:jdbc:postgresql://localhost:5434/storages}
spring.datasource.username=${STORAGE_DB_USER:storages}
spring.datasource.password=${STORAGE_DB_PASSWORD:storages}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP_ADDRESS:false}
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.client.registry-fetch-interval-seconds=5
management.endpoints.web.exposure.include=health
storage.defaults.staging.bucket=${STAGING_STORAGE_BUCKET:resources-staging}
storage.defaults.staging.path=${STAGING_STORAGE_PATH:/files}
storage.defaults.permanent.bucket=${PERMANENT_STORAGE_BUCKET:resources-permanent}
storage.defaults.permanent.path=${PERMANENT_STORAGE_PATH:/files}
