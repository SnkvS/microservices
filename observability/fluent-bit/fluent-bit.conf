[SERVICE]
    Flush 1
    Log_Level info
    Parsers_File /fluent-bit/etc/parsers.conf
    storage.path /var/lib/fluent-bit/buffer
    storage.sync normal
    storage.checksum on
    HTTP_Server On
    HTTP_Listen 0.0.0.0
    HTTP_Port 2020
    Health_Check On

[INPUT]
    Name tail
    Tag applications
    Path /var/log/services/*/*.json,/var/log/services/*/*.json.*.rotated
    Parser application_json
    DB /var/lib/fluent-bit/tail.db
    DB.Sync Normal
    Read_from_Head On
    Refresh_Interval 1
    Rotate_Wait 30
    Buffer_Max_Size 1M
    Skip_Long_Lines On
    storage.type filesystem

[OUTPUT]
    Name es
    Match applications
    Host elasticsearch
    Port 9200
    Index microservices-logs
    Suppress_Type_Name On
    Generate_ID On
    Write_Operation create
    Retry_Limit False
    storage.total_limit_size 100M
