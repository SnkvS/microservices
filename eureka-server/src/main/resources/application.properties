spring.application.name=eureka-server
server.port=${EUREKA_SERVER_PORT:8761}
eureka.instance.hostname=${EUREKA_SERVER_HOSTNAME:localhost}
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

management.endpoints.web.exposure.include=health,prometheus

# Structured application logs are consumed by Fluent Bit in Compose.
logging.structured.format.console=logstash
logging.structured.format.file=logstash
logging.structured.json.add.service=${spring.application.name}
logging.logback.rollingpolicy.max-file-size=10MB
# Retain readable archives so the collector can catch up after an outage.
logging.logback.rollingpolicy.file-name-pattern=${logging.file.name:application.json}.%d{yyyy-MM-dd}.%i.rotated
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=100MB
management.metrics.tags.application=${spring.application.name}
