spring.application.name=resource-processor
spring.main.web-application-type=none
spring.main.keep-alive=true
resource.service.url=${RESOURCE_SERVICE_URL:http://resource-service}
song.service.url=${SONG_SERVICE_URL:http://song-service}
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=false
eureka.client.registry-fetch-interval-seconds=5
spring.cloud.loadbalancer.cache.enabled=false
# The explicit HTTP RetryTemplate owns the retry budget.
spring.cloud.loadbalancer.retry.enabled=false
communication.http.max-attempts=${HTTP_MAX_ATTEMPTS:3}
communication.http.initial-delay=${HTTP_INITIAL_DELAY:1000}
communication.http.max-delay=${HTTP_MAX_DELAY:5000}
communication.http.connect-timeout=${HTTP_CONNECT_TIMEOUT:2000}
communication.http.read-timeout=${HTTP_READ_TIMEOUT:5000}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:resources}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:resources}
spring.rabbitmq.connection-timeout=5s
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.prefetch=1
resource.messaging.exchange=resources
resource.messaging.queue=resource.processing
resource.messaging.routing-key=resource.uploaded
resource.messaging.retry.max-attempts=${LISTENER_MAX_ATTEMPTS:5}
resource.messaging.retry.initial-delay=${LISTENER_INITIAL_DELAY:1000}
resource.messaging.retry.max-delay=${LISTENER_MAX_DELAY:10000}
