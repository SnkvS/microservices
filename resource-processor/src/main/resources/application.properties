spring.application.name=resource-processor
server.port=${PROCESSOR_PORT:8083}
resource.service.url=${RESOURCE_SERVICE_URL:http://resource-service}
song.service.url=${SONG_SERVICE_URL:http://song-service}
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=false
eureka.client.registry-fetch-interval-seconds=5
spring.cloud.loadbalancer.cache.enabled=false
# The explicit HTTP RetryTemplate owns the retry budget.
spring.cloud.loadbalancer.retry.enabled=false
communication.http.max-attempts=${HTTP_MAX_ATTEMPTS:3}
communication.http.initial-delay=${HTTP_INITIAL_DELAY:1000}
communication.http.max-delay=${HTTP_MAX_DELAY:5000}
communication.http.connect-timeout=${HTTP_CONNECT_TIMEOUT:2000}
communication.http.read-timeout=${HTTP_READ_TIMEOUT:5000}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:resources}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:resources}
spring.rabbitmq.connection-timeout=5s
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.prefetch=1
resource.messaging.exchange=resources
resource.messaging.queue=resource.processing
resource.messaging.routing-key=resource.uploaded
resource.messaging.retry.max-attempts=${LISTENER_MAX_ATTEMPTS:5}
resource.messaging.retry.initial-delay=${LISTENER_INITIAL_DELAY:1000}
resource.messaging.retry.max-delay=${LISTENER_MAX_DELAY:10000}

management.endpoints.web.exposure.include=health,prometheus

spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
processed.publish.max-attempts=${PUBLISH_MAX_ATTEMPTS:3}
processed.publish.initial-delay=${PUBLISH_INITIAL_DELAY:1000}
processed.publish.max-delay=${PUBLISH_MAX_DELAY:5000}
resource.messaging.confirm-timeout=${PUBLISH_CONFIRM_TIMEOUT:5000}

# Structured application logs are consumed by Fluent Bit in Compose.
logging.structured.format.console=logstash
logging.structured.format.file=logstash
logging.structured.json.add.service=${spring.application.name}
logging.logback.rollingpolicy.max-file-size=10MB
# Retain readable archives so the collector can catch up after an outage.
logging.logback.rollingpolicy.file-name-pattern=${logging.file.name:application.json}.%d{yyyy-MM-dd}.%i.rotated
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=100MB
management.metrics.tags.application=${spring.application.name}
