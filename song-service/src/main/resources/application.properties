server.port=${SONG_SERVICE_PORT:8081}
spring.datasource.url=${SONG_DB_URL:jdbc:postgresql://localhost:5433/songs}
spring.datasource.username=${SONG_DB_USER:songs}
spring.datasource.password=${SONG_DB_PASSWORD:songs}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP_ADDRESS:false}
# Short intervals support this local development and screening environment.
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.client.registry-fetch-interval-seconds=5
spring.application.name=song-service
