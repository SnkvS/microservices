spring.application.name=api-gateway
server.port=${GATEWAY_PORT:8082}
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP_ADDRESS:false}
# Short intervals support local development and the screening environment.
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.client.registry-fetch-interval-seconds=5
# Eureka already caches its registry; avoid another discovery cache.
spring.cloud.loadbalancer.cache.enabled=false
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=${GATEWAY_CONNECT_TIMEOUT:2000}
spring.cloud.gateway.server.webflux.httpclient.response-timeout=${GATEWAY_RESPONSE_TIMEOUT:10s}
spring.cloud.gateway.server.webflux.routes[0].id=song-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://song-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/songs,/songs/**
spring.cloud.gateway.server.webflux.routes[1].id=resource-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://resource-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/resources,/resources/**
management.endpoints.web.exposure.include=health,prometheus

spring.cloud.gateway.server.webflux.routes[2].id=storage-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://storage-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/storages,/storages/**

# Structured application logs are consumed by Fluent Bit in Compose.
logging.structured.format.console=logstash
logging.structured.format.file=logstash
logging.structured.json.add.service=${spring.application.name}
logging.logback.rollingpolicy.max-file-size=10MB
# Retain readable archives so the collector can catch up after an outage.
logging.logback.rollingpolicy.file-name-pattern=${logging.file.name:application.json}.%d{yyyy-MM-dd}.%i.rotated
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=100MB
management.metrics.tags.application=${spring.application.name}
spring.cloud.gateway.server.webflux.metrics.enabled=true
spring.cloud.gateway.server.webflux.metrics.path-tags.enabled=false
management.metrics.distribution.percentiles-histogram.spring.cloud.gateway.requests=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
