spring.application.name=api-gateway
server.port=${GATEWAY_PORT:8082}

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP_ADDRESS:false}
# Short intervals support local development and the screening environment.
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.client.registry-fetch-interval-seconds=5
# Eureka already caches its registry; avoid another discovery cache.
spring.cloud.loadbalancer.cache.enabled=false

spring.cloud.gateway.server.webflux.routes[0].id=song-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://song-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/songs,/songs/**
spring.cloud.gateway.server.webflux.routes[1].id=resource-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://resource-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/resources,/resources/**

management.endpoints.web.exposure.include=health
