server.port=${RESOURCE_SERVICE_PORT:8080}
spring.datasource.url=${RESOURCE_DB_URL:jdbc:postgresql://localhost:5432/resources}
spring.datasource.username=${RESOURCE_DB_USER:resources}
spring.datasource.password=${RESOURCE_DB_PASSWORD:resources}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
song.service.url=${SONG_SERVICE_URL:http://song-service}
resource.storage.endpoint=${RESOURCE_STORAGE_ENDPOINT:http://localhost:4566}
resource.storage.region=${RESOURCE_STORAGE_REGION:us-east-1}
resource.storage.bucket=${RESOURCE_STORAGE_BUCKET:resources}
resource.storage.access-key=${AWS_ACCESS_KEY_ID:test}
resource.storage.secret-key=${AWS_SECRET_ACCESS_KEY:test}
spring.servlet.multipart.max-file-size=20MB
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP_ADDRESS:false}
# Short intervals support this local development and screening environment.
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.client.registry-fetch-interval-seconds=5
# Eureka already caches the registry; avoid a second cache delaying instance changes.
spring.cloud.loadbalancer.cache.enabled=false
# The explicit HTTP RetryTemplate owns the retry budget.
spring.cloud.loadbalancer.retry.enabled=false
spring.application.name=resource-service
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:resources}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:resources}
spring.rabbitmq.connection-timeout=5s
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
resource.messaging.exchange=resources
resource.messaging.queue=resource.processing
resource.messaging.routing-key=resource.uploaded
resource.messaging.retry.max-attempts=${PUBLISH_MAX_ATTEMPTS:3}
resource.messaging.retry.initial-delay=${PUBLISH_INITIAL_DELAY:1000}
resource.messaging.retry.max-delay=${PUBLISH_MAX_DELAY:5000}
resource.messaging.confirm-timeout=${PUBLISH_CONFIRM_TIMEOUT:5000}
communication.http.max-attempts=${HTTP_MAX_ATTEMPTS:3}
communication.http.initial-delay=${HTTP_INITIAL_DELAY:1000}
communication.http.max-delay=${HTTP_MAX_DELAY:5000}
communication.http.connect-timeout=${HTTP_CONNECT_TIMEOUT:2000}
communication.http.read-timeout=${HTTP_READ_TIMEOUT:5000}
