# Explicit single-instance debug ports. Omit this file when scaling services.
# docker compose -f compose.yaml -f compose.development.yaml up -d --build
services:
  song-service:
    ports: [ "127.0.0.1:${SONG_SERVICE_PORT:-8081}:8081" ]
  resource-service:
    ports: [ "127.0.0.1:${RESOURCE_SERVICE_PORT:-8080}:8080" ]
  resource-processor:
    ports: [ "127.0.0.1:${PROCESSOR_PORT:-8083}:8083" ]
