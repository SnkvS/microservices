services:
  resource-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${RESOURCE_DB_NAME}
      POSTGRES_USER: ${RESOURCE_DB_USER}
      POSTGRES_PASSWORD: ${RESOURCE_DB_PASSWORD}
    ports:
      - "${RESOURCE_DB_PORT}:5432"
    volumes:
      - ./init-scripts/resource-db:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
  song-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${SONG_DB_NAME}
      POSTGRES_USER: ${SONG_DB_USER}
      POSTGRES_PASSWORD: ${SONG_DB_PASSWORD}
    ports:
      - "${SONG_DB_PORT}:5432"
    volumes:
      - ./init-scripts/song-db:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
  resource-service:
    build: ./resource-service
    ports:
      - "${RESOURCE_SERVICE_PORT}:8080"
    environment:
      RESOURCE_DB_URL: ${RESOURCE_DB_URL}
      RESOURCE_DB_USER: ${RESOURCE_DB_USER}
      RESOURCE_DB_PASSWORD: ${RESOURCE_DB_PASSWORD}
      SONG_SERVICE_URL: ${SONG_SERVICE_URL}
    depends_on:
      resource-db:
        condition: service_healthy
      song-service:
        condition: service_started
  song-service:
    build: ./song-service
    ports:
      - "${SONG_SERVICE_PORT}:8081"
    environment:
      SONG_DB_URL: ${SONG_DB_URL}
      SONG_DB_USER: ${SONG_DB_USER}
      SONG_DB_PASSWORD: ${SONG_DB_PASSWORD}
    depends_on:
      song-db:
        condition: service_healthy
