x-storage-locations: &storage-locations
  STAGING_STORAGE_BUCKET: ${STAGING_STORAGE_BUCKET:-resources-staging}
  STAGING_STORAGE_PATH: ${STAGING_STORAGE_PATH:-/files}
  PERMANENT_STORAGE_BUCKET: ${PERMANENT_STORAGE_BUCKET:-resources-permanent}
  PERMANENT_STORAGE_PATH: ${PERMANENT_STORAGE_PATH:-/files}

# .env overrides these development defaults automatically. *_PORT values publish
# fixed container ports on the host; local applications use localhost defaults.
x-app-health: &app-health
  interval: 5s
  timeout: 5s
  retries: 30
  start_period: 30s

x-discovery: &discovery
  EUREKA_SERVER_URL: ${EUREKA_SERVER_URL:-http://eureka-server:8761/eureka/}
  EUREKA_PREFER_IP_ADDRESS: ${EUREKA_PREFER_IP_ADDRESS:-true}

x-messaging: &messaging
  RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
  RABBITMQ_PORT: 5672
  RABBITMQ_USER: ${RABBITMQ_USER:-resources}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-resources}

x-http-retry: &http-retry
  HTTP_MAX_ATTEMPTS: ${HTTP_MAX_ATTEMPTS:-3}
  HTTP_INITIAL_DELAY: ${HTTP_INITIAL_DELAY:-1000}
  HTTP_MAX_DELAY: ${HTTP_MAX_DELAY:-5000}
  HTTP_CONNECT_TIMEOUT: ${HTTP_CONNECT_TIMEOUT:-2000}
  HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-5000}

services:
  resource-db:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_DB: ${RESOURCE_DB_NAME:-resources}
      POSTGRES_USER: ${RESOURCE_DB_USER:-resources}
      POSTGRES_PASSWORD: ${RESOURCE_DB_PASSWORD:-resources}
    ports: [ "${RESOURCE_DB_PORT:-5432}:5432" ]
    volumes: [ "./init-scripts/resource-db:/docker-entrypoint-initdb.d:ro" ]
    tmpfs: [ /var/lib/postgresql/data ]
    healthcheck:
      test: [ CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"' ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  storage-db:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_DB: ${STORAGE_DB_NAME:-storages}
      POSTGRES_USER: ${STORAGE_DB_USER:-storages}
      POSTGRES_PASSWORD: ${STORAGE_DB_PASSWORD:-storages}
    ports: [ "${STORAGE_DB_PORT:-5434}:5432" ]
    volumes: [ "./init-scripts/storage-db:/docker-entrypoint-initdb.d:ro" ]
    tmpfs: [ /var/lib/postgresql/data ]
    healthcheck:
      test: [ CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"' ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s


  song-db:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_DB: ${SONG_DB_NAME:-songs}
      POSTGRES_USER: ${SONG_DB_USER:-songs}
      POSTGRES_PASSWORD: ${SONG_DB_PASSWORD:-songs}
    ports: [ "${SONG_DB_PORT:-5433}:5432" ]
    volumes: [ "./init-scripts/song-db:/docker-entrypoint-initdb.d:ro" ]
    tmpfs: [ /var/lib/postgresql/data ]
    healthcheck:
      test: [ CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"' ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:4.1-management}
    hostname: rabbitmq
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-resources}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-resources}
    volumes: [ "rabbitmq-data:/var/lib/rabbitmq" ]
    healthcheck:
      test: [ CMD, rabbitmq-diagnostics, -q, check_running ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  localstack:
    build:
      context: ./init-scripts/localstack
      args:
        LOCALSTACK_IMAGE: ${LOCALSTACK_IMAGE:-localstack/localstack:4.14.0}
    ports: [ "${LOCALSTACK_PORT:-4566}:4566" ]
    environment:
      <<: *storage-locations
      SERVICES: s3
      RESOURCE_STORAGE_BUCKET: ${RESOURCE_STORAGE_BUCKET:-resources}
      AWS_DEFAULT_REGION: ${RESOURCE_STORAGE_REGION:-us-east-1}
    healthcheck:
      test: [ CMD-SHELL, 'awslocal s3api head-bucket --bucket "$$RESOURCE_STORAGE_BUCKET" >/dev/null 2>&1 && awslocal s3api head-bucket --bucket "$$STAGING_STORAGE_BUCKET" >/dev/null 2>&1 && awslocal s3api head-bucket --bucket "$$PERMANENT_STORAGE_BUCKET" >/dev/null 2>&1' ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  eureka-server:
    build: ./eureka-server
    ports: [ "${EUREKA_SERVER_PORT:-8761}:8761" ]
    volumes: [ "application-logs:/var/log/services" ]
    environment:
      LOGGING_FILE_NAME: /var/log/services/eureka-server/$${HOSTNAME}.json
      EUREKA_SERVER_HOSTNAME: ${EUREKA_SERVER_HOSTNAME:-eureka-server}
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL:-http://eureka-server:8761/eureka/}
    healthcheck:
      <<: *app-health
      test: [ CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8761/actuator/health" ]

  storage-service:
    build: ./storage-service
    volumes: [ "application-logs:/var/log/services" ]
    environment:
      LOGGING_FILE_NAME: /var/log/services/storage-service/$${HOSTNAME}.json
      <<: [ *discovery, *storage-locations ]
      STORAGE_DB_URL: ${STORAGE_DB_URL:-jdbc:postgresql://storage-db:5432/${STORAGE_DB_NAME:-storages}}
      STORAGE_DB_USER: ${STORAGE_DB_USER:-storages}
      STORAGE_DB_PASSWORD: ${STORAGE_DB_PASSWORD:-storages}
    healthcheck:
      <<: *app-health
      test: [ CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8084/actuator/health" ]
    depends_on:
      storage-db: { condition: service_healthy }
      eureka-server: { condition: service_healthy }


  song-service:
    build: ./song-service
    volumes: [ "application-logs:/var/log/services" ]
    environment:
      LOGGING_FILE_NAME: /var/log/services/song-service/$${HOSTNAME}.json
      <<: *discovery
      SONG_DB_URL: ${SONG_DB_URL:-jdbc:postgresql://song-db:5432/${SONG_DB_NAME:-songs}}
      SONG_DB_USER: ${SONG_DB_USER:-songs}
      SONG_DB_PASSWORD: ${SONG_DB_PASSWORD:-songs}
    healthcheck:
      <<: *app-health
      test: [ CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8081/actuator/health" ]
    depends_on:
      song-db: { condition: service_healthy }
      eureka-server: { condition: service_healthy }

  resource-service:
    build: ./resource-service
    volumes: [ "application-logs:/var/log/services" ]
    environment:
      LOGGING_FILE_NAME: /var/log/services/resource-service/$${HOSTNAME}.json
      <<: [ *discovery, *messaging, *http-retry, *storage-locations ]
      RESOURCE_DB_URL: ${RESOURCE_DB_URL:-jdbc:postgresql://resource-db:5432/${RESOURCE_DB_NAME:-resources}}
      RESOURCE_DB_USER: ${RESOURCE_DB_USER:-resources}
      RESOURCE_DB_PASSWORD: ${RESOURCE_DB_PASSWORD:-resources}
      SONG_SERVICE_URL: ${SONG_SERVICE_URL:-http://song-service}
      RESOURCE_STORAGE_ENDPOINT: ${RESOURCE_STORAGE_ENDPOINT:-http://localstack:4566}
      RESOURCE_STORAGE_REGION: ${RESOURCE_STORAGE_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      PUBLISH_MAX_ATTEMPTS: ${PUBLISH_MAX_ATTEMPTS:-3}
      PUBLISH_INITIAL_DELAY: ${PUBLISH_INITIAL_DELAY:-1000}
      PUBLISH_MAX_DELAY: ${PUBLISH_MAX_DELAY:-5000}
      PUBLISH_CONFIRM_TIMEOUT: ${PUBLISH_CONFIRM_TIMEOUT:-5000}
    healthcheck:
      <<: *app-health
      test: [ CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health" ]
    depends_on:
      resource-db: { condition: service_healthy }
      localstack: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
      song-service: { condition: service_healthy }

  resource-processor:
    build: ./resource-processor
    volumes: [ "application-logs:/var/log/services" ]
    environment:
      LOGGING_FILE_NAME: /var/log/services/resource-processor/$${HOSTNAME}.json
      <<: [ *discovery, *messaging, *http-retry ]
      RESOURCE_SERVICE_URL: ${RESOURCE_SERVICE_URL:-http://resource-service}
      SONG_SERVICE_URL: ${SONG_SERVICE_URL:-http://song-service}
      LISTENER_MAX_ATTEMPTS: ${LISTENER_MAX_ATTEMPTS:-5}
      LISTENER_INITIAL_DELAY: ${LISTENER_INITIAL_DELAY:-1000}
      LISTENER_MAX_DELAY: ${LISTENER_MAX_DELAY:-10000}
    healthcheck:
      <<: *app-health
      test: [ CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8083/actuator/health" ]
    depends_on:
      rabbitmq: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
      resource-service: { condition: service_healthy }
      song-service: { condition: service_healthy }

  api-gateway:
    build: ./api-gateway
    ports: [ "${GATEWAY_PORT:-8082}:8082" ]
    volumes: [ "application-logs:/var/log/services" ]
    environment:
      LOGGING_FILE_NAME: /var/log/services/api-gateway/$${HOSTNAME}.json
      <<: *discovery
      GATEWAY_CONNECT_TIMEOUT: ${GATEWAY_CONNECT_TIMEOUT:-2000}
      GATEWAY_RESPONSE_TIMEOUT: ${GATEWAY_RESPONSE_TIMEOUT:-10s}
    healthcheck:
      <<: *app-health
      test: [ CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8082/actuator/health" ]
    depends_on:
      eureka-server: { condition: service_healthy }
      resource-service: { condition: service_healthy }
      song-service: { condition: service_healthy }
      resource-processor: { condition: service_healthy }

  elasticsearch:
    image: ${ELASTICSEARCH_IMAGE:-docker.elastic.co/elasticsearch/elasticsearch:8.19.7}
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports: [ "127.0.0.1:${ELASTICSEARCH_PORT:-9200}:9200" ]
    volumes: [ "elasticsearch-data:/usr/share/elasticsearch/data" ]
    healthcheck:
      test: [ CMD-SHELL, "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s' >/dev/null" ]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s

  fluent-bit:
    image: ${FLUENT_BIT_IMAGE:-fluent/fluent-bit:4.2.0}
    volumes:
      - ./observability/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./observability/fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - application-logs:/var/log/services:ro
      - fluent-bit-state:/var/lib/fluent-bit
    depends_on:
      elasticsearch: { condition: service_healthy }

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.7.3}
    command: [ --config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus, --storage.tsdb.retention.time=7d ]
    ports: [ "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090" ]
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: [ CMD-SHELL, "wget -q -O /dev/null http://localhost:9090/-/ready" ]
      interval: 5s
      timeout: 5s
      retries: 24

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:12.3.0}
    ports: [ "127.0.0.1:${GRAFANA_PORT:-3000}:3000" ]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-monitoring}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      elasticsearch: { condition: service_healthy }
      prometheus: { condition: service_healthy }
    healthcheck:
      test: [ CMD-SHELL, "wget -q -O /dev/null http://localhost:3000/api/health" ]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  rabbitmq-data:
  application-logs:
  elasticsearch-data:
  fluent-bit-state:
  prometheus-data:
  grafana-data:
