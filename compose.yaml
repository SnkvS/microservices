services:
  resource-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: resources
      POSTGRES_USER: resources
      POSTGRES_PASSWORD: resources
    ports:
      - "5432:5432"
    volumes:
      - resource_data:/var/lib/postgresql/data
  song-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: songs
      POSTGRES_USER: songs
      POSTGRES_PASSWORD: songs
    ports:
      - "5433:5432"
    volumes:
      - song_data:/var/lib/postgresql/data
volumes:
  resource_data:
  song_data:
