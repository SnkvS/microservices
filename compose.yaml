services:
  api-gateway:
    build: ./api-gateway
    ports:
      - "${GATEWAY_PORT:-8082}:8082"
    environment:
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL}
      EUREKA_PREFER_IP_ADDRESS: ${EUREKA_PREFER_IP_ADDRESS}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8082/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    depends_on:
      eureka-server:
        condition: service_healthy
      resource-service:
        condition: service_started
      song-service:
        condition: service_started
  eureka-server:
    build: ./eureka-server
    ports:
      - "${EUREKA_SERVER_PORT}:8761"
    environment:
      EUREKA_SERVER_HOSTNAME: ${EUREKA_SERVER_HOSTNAME}
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8761/"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
  resource-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${RESOURCE_DB_NAME}
      POSTGRES_USER: ${RESOURCE_DB_USER}
      POSTGRES_PASSWORD: ${RESOURCE_DB_PASSWORD}
    ports:
      - "${RESOURCE_DB_PORT}:5432"
    volumes:
      - ./init-scripts/resource-db:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
  song-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${SONG_DB_NAME}
      POSTGRES_USER: ${SONG_DB_USER}
      POSTGRES_PASSWORD: ${SONG_DB_PASSWORD}
    ports:
      - "${SONG_DB_PORT}:5432"
    volumes:
      - ./init-scripts/song-db:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
  resource-service:
    build: ./resource-service
    ports:
      - "${RESOURCE_SERVICE_PORT}:8080"
    environment:
      RESOURCE_DB_URL: ${RESOURCE_DB_URL}
      RESOURCE_DB_USER: ${RESOURCE_DB_USER}
      RESOURCE_DB_PASSWORD: ${RESOURCE_DB_PASSWORD}
      SONG_SERVICE_URL: ${SONG_SERVICE_URL}
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL}
      EUREKA_PREFER_IP_ADDRESS: ${EUREKA_PREFER_IP_ADDRESS}
    depends_on:
      eureka-server:
        condition: service_healthy
      resource-db:
        condition: service_healthy
      song-service:
        condition: service_started
  song-service:
    build: ./song-service
    ports:
      - "${SONG_SERVICE_PORT}"
    environment:
      SONG_DB_URL: ${SONG_DB_URL}
      SONG_DB_USER: ${SONG_DB_USER}
      SONG_DB_PASSWORD: ${SONG_DB_PASSWORD}
      SONG_SERVICE_PORT: ${SONG_SERVICE_PORT}
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL}
      EUREKA_PREFER_IP_ADDRESS: ${EUREKA_PREFER_IP_ADDRESS}
    depends_on:
      eureka-server:
        condition: service_healthy
      song-db:
        condition: service_healthy
